name: Android and web checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: |
            test-results/
            artifacts/
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - run: chmod +x gradlew && ./gradlew assembleDebug assembleRelease lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: chalanger-release-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/lint-results-debug.html
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            mkdir -p ../artifacts/android
            adb pull /sdcard/Pictures/ChalangerTest ../artifacts/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-results
          path: |
            android/app/build/reports/androidTests/
            artifacts/android/
          if-no-files-found: ignore
